name: Deploy frontend to GitHub Pages

# Builds the Vite frontend and publishes it to GitHub Pages.
#
# Backend URL
# -----------
# The frontend reads `VITE_API_URL` at build time (see `server/services/apiClient.ts`
# and `server/services/backendService.ts`). Set this to the public URL of the
# deployed Express backend (e.g. an "onrender.com" or "fly.dev" URL), including
# the trailing `/api`:
#
#   Repo → Settings → Secrets and variables → Actions → Variables
#     Name:  VITE_API_URL
#     Value: https://your-backend.example.com/api
#
# If `VITE_API_URL` is not set the build still succeeds, but the deployed page
# will show "Backend: Offline" because same-origin "/api/*" requests 404 on
# GitHub Pages (it's a static host).
#
# Base path
# ---------
# This is a project site, so the app is served from `https://<user>.github.io/<repo>/`.
# We pass `VITE_BASE=/<repo>/` so Vite rewrites asset URLs accordingly.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Point the frontend at the deployed backend. Set this in repo
          # Settings → Secrets and variables → Actions → Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # GitHub project site base path, e.g. "/usa-importer-intel/".
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Configure SPA fallback and disable Jekyll
        run: |
          # GitHub Pages has no SPA fallback; serving index.html as 404.html
          # makes client-side routes work even on deep links.
          cp dist/index.html dist/404.html
          # Prevent Jekyll from ignoring files that start with "_".
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
